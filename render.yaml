services:
  - type: web
    name: AgentShelf
    runtime: node
    # Matches the existing service, do not create a second web service
    plan: 0.5c-512mb
    region: frankfurt
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run here because preDeployCommand needs a paid plan. If one fails, the
    # deploy fails and Render keeps serving the previous version. See docs/deployment.md.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agentshelf-db
          property: connectionString
      - key: APP_SIGNING_SECRET
        generateValue: true

  # Reads price list photos. Not created on Render yet, and the web service reads them itself until
  # it is. See "Render Workflows for photo import" in docs/deployment.md.
  - type: workflow
    name: agentshelf-import
    repo: https://github.com/ever-guild/AgentShelf
    runtime: node
    region: frankfurt
    branch: main
    # Never auto-deploys. CI releases the exact CI-checked commit after the web deploy is verified
    # (POST /v1/workflowversions); a freeze disables the CI deploy job, so no release happens either.
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev
    startCommand: npx tsx workflows/main.ts
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: agentshelf-db
          property: connectionString
      - key: AGENT_SHELF_AI_PROVIDER
        sync: false
      - key: AGENT_SHELF_AI_PROVIDER_BASE_URL
        sync: false
      - key: AGENT_SHELF_AI_PROVIDER_API_KEY
        sync: false

databases:
  # A free database expires 30 days after creation. See docs/deployment.md before judging.
  - name: agentshelf-db
    databaseName: agentshelf
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
