services:
  - type: web
    name: agentshelf
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    # Migrations run here because preDeployCommand needs a paid plan. If one fails, the
    # deploy fails and Render keeps serving the previous version. See docs/deployment.md.
    startCommand: npm run db:migrate && npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: agentshelf-db
          property: connectionString
      - key: APP_SIGNING_SECRET
        generateValue: true

databases:
  # A free database expires 30 days after creation. See docs/deployment.md before judging.
  - name: agentshelf-db
    databaseName: agentshelf
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
