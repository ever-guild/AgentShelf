name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: lint-test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agentshelf_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentshelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/agentshelf_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm test
      - run: npm run build

  deploy:
    name: deploy-render
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-render-agentshelf-e5bk
      cancel-in-progress: false
    environment:
      name: agentshelf-e5bk.onrender.com
      url: https://agentshelf-e5bk.onrender.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Sync AI settings from GitHub Environment to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          AGENT_SHELF_AI_PROVIDER: ${{ vars.AGENT_SHELF_AI_PROVIDER }}
          AGENT_SHELF_AI_PROVIDER_BASE_URL: ${{ vars.AGENT_SHELF_AI_PROVIDER_BASE_URL }}
          AGENT_SHELF_AI_PROVIDER_API_KEY: ${{ secrets.AGENT_SHELF_AI_PROVIDER_API_KEY }}
          AG_STUDIO: ${{ secrets.AG_STUDIO }}
          RENDER_WORKFLOW_ID: ${{ vars.RENDER_WORKFLOW_ID }}
        run: node scripts/sync-render-ai-env.mjs
      - name: Trigger and verify Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          RENDER_WORKFLOW_ID: ${{ vars.RENDER_WORKFLOW_ID }}
          PUBLIC_BASE_URL: https://agentshelf-e5bk.onrender.com
        run: node scripts/deploy-render.mjs
